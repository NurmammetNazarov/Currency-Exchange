<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Para Birimi Dönüştürücü</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">💱 Para Birimi Dönüştürücü</h2>

        <div class="mb-3">
          <input type="number" id="amount" class="form-control" placeholder="Miktar girin" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <select id="from" class="form-select"></select>
          </div>
          <div class="col-md-2 d-flex align-items-center justify-content-center">
            <button class="btn btn-outline-secondary w-100" onclick="swapCurrencies()" title="Takas Et">
              <i class="fas fa-arrows-alt-h"></i>
            </button>
          </div>
          <div class="col-md-5">
            <select id="to" class="form-select"></select>
          </div>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary" onclick="convertCurrency()">Dönüştür</button>
        </div>

        <h4 id="result" class="text-center mt-4 text-success"></h4>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
